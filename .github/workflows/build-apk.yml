name: Build VibeOS TV Launcher APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile & Sign VibeOS TV APK (Direct Android SDK Tools)
        run: |
          set -e
          mkdir -p vibeos_apk/src/com/vibeos/tvlauncher vibeos_apk/gen vibeos_apk/obj
          cd vibeos_apk

          ANDROID_JAR=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -n 1)/android.jar
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using ANDROID_JAR: $ANDROID_JAR"
          echo "Using BUILD_TOOLS: $BUILD_TOOLS"

          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.vibeos.tvlauncher"
              android:versionCode="1"
              android:versionName="1.0.0">

              <uses-sdk
                  android:minSdkVersion="26"
                  android:targetSdkVersion="34" />

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />

              <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />
              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:banner="@android:drawable/sym_def_app_icon"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="VibeOS TV"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > src/com/vibeos/tvlauncher/MainActivity.java
          package com.vibeos.tvlauncher;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.DialogInterface;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.GridLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.HashSet;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;

          public class MainActivity extends Activity {

              private static class AppItem {
                  final String label;
                  final String packageName;
                  final Drawable icon;
                  final Drawable banner;
                  final boolean isLeanback;
                  final int accentColor;

                  AppItem(String label, String packageName, Drawable icon, Drawable banner, boolean isLeanback, int accentColor) {
                      this.label = label;
                      this.packageName = packageName;
                      this.icon = icon;
                      this.banner = banner;
                      this.isLeanback = isLeanback;
                      this.accentColor = accentColor;
                  }
              }

              private static final int[] PALETTE = new int[]{
                      0xFF2563EB, // Royal Blue
                      0xFF7C3AED, // Vivid Violet
                      0xFFDB2777, // Rose Pink
                      0xFF059669, // Emerald
                      0xFFD97706, // Amber Gold
                      0xFF0891B2, // Cyan
                      0xFF4F46E5, // Indigo
                      0xFFE11D48  // Crimson
              };

              private static final List<String> DEFAULT_DOCK_PACKAGES = Arrays.asList(
                      "com.google.android.youtube.tv",
                      "com.netflix.ninja",
                      "com.amazon.avod.thirdpartyclient",
                      "in.startv.hotstar",
                      "com.jio.media.stb.ondemand",
                      "com.android.tv.settings"
              );

              private SharedPreferences prefs;
              private Set<String> pinnedPackages;
              private List<AppItem> allApps = new ArrayList<AppItem>();

              private FrameLayout rootContainer;
              private TextView heroBadgeView;
              private TextView heroTitleView;
              private TextView heroSubtitleView;
              private TextView clockTimeView;
              private TextView clockDateView;
              private TextView countLabelView;
              private LinearLayout dockRowLayout;
              private GridLayout appsGridLayout;

              private final Handler clockHandler = new Handler(Looper.getMainLooper());
              private final Runnable clockRunnable = new Runnable() {
                  @Override
                  public void run() {
                      updateClock();
                      clockHandler.postDelayed(this, 10000L);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences("vibeos_tv_prefs", Context.MODE_PRIVATE);
                  Set<String> saved = prefs.getStringSet("pinned_dock", null);
                  if (saved != null && !saved.isEmpty()) {
                      pinnedPackages = new HashSet<String>(saved);
                  } else {
                      pinnedPackages = new HashSet<String>(DEFAULT_DOCK_PACKAGES);
                  }

                  buildAppleTvUi();
                  refreshAppCatalog();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  clockHandler.removeCallbacks(clockRunnable);
                  clockRunnable.run();
                  refreshAppCatalog();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  clockHandler.removeCallbacks(clockRunnable);
              }

              @Override
              public void onBackPressed() {
                  // Ignore Back key on Home Launcher so it stays on Home screen
              }

              private int dp(int value) {
                  return (int) TypedValue.applyDimension(
                          TypedValue.COMPLEX_UNIT_DIP,
                          (float) value,
                          getResources().getDisplayMetrics()
                  );
              }

              private void buildAppleTvUi() {
                  rootContainer = new FrameLayout(this);
                  updateAmbientBackground(0xFF2563EB);

                  LinearLayout mainColumn = new LinearLayout(this);
                  mainColumn.setOrientation(LinearLayout.VERTICAL);
                  mainColumn.setPadding(dp(44), dp(26), dp(44), dp(26));
                  rootContainer.addView(mainColumn, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  // 1. Top Hero Showcase ("Top Shelf") + Clock & Settings Pill
                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.TOP);

                  LinearLayout heroColumn = new LinearLayout(this);
                  heroColumn.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout.LayoutParams heroLp = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.0f);
                  topBar.addView(heroColumn, heroLp);

                  heroBadgeView = new TextView(this);
                  heroBadgeView.setText("VIBEOS TV  •  AD-FREE");
                  heroBadgeView.setTextColor(0xD9FFFFFF);
                  heroBadgeView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11);
                  heroBadgeView.setTypeface(Typeface.DEFAULT_BOLD);
                  heroBadgeView.setPadding(dp(12), dp(4), dp(12), dp(4));
                  GradientDrawable badgeBg = new GradientDrawable();
                  badgeBg.setColor(0x22FFFFFF);
                  badgeBg.setCornerRadius(dp(50));
                  heroBadgeView.setBackground(badgeBg);
                  LinearLayout.LayoutParams badgeLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  heroColumn.addView(heroBadgeView, badgeLp);

                  heroTitleView = new TextView(this);
                  heroTitleView.setText("VibeOS Home");
                  heroTitleView.setTextColor(Color.WHITE);
                  heroTitleView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 32);
                  heroTitleView.setTypeface(Typeface.DEFAULT_BOLD);
                  heroTitleView.setSingleLine(true);
                  heroTitleView.setEllipsize(TextUtils.TruncateAt.END);
                  LinearLayout.LayoutParams titleLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  titleLp.topMargin = dp(8);
                  heroColumn.addView(heroTitleView, titleLp);

                  heroSubtitleView = new TextView(this);
                  heroSubtitleView.setText("Press OK to launch  •  Hold OK to Pin / Manage App");
                  heroSubtitleView.setTextColor(0x99FFFFFF);
                  heroSubtitleView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  heroSubtitleView.setSingleLine(true);
                  LinearLayout.LayoutParams subLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  subLp.topMargin = dp(3);
                  heroColumn.addView(heroSubtitleView, subLp);

                  // Right side: Settings Button + Clock
                  LinearLayout rightBar = new LinearLayout(this);
                  rightBar.setOrientation(LinearLayout.HORIZONTAL);
                  rightBar.setGravity(Gravity.CENTER_VERTICAL);
                  topBar.addView(rightBar, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  ));

                  final TextView settingsBtn = new TextView(this);
                  settingsBtn.setText("⚙ TV Settings");
                  settingsBtn.setTextColor(Color.WHITE);
                  settingsBtn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  settingsBtn.setTypeface(Typeface.DEFAULT_BOLD);
                  settingsBtn.setPadding(dp(16), dp(8), dp(16), dp(8));
                  settingsBtn.setFocusable(true);
                  settingsBtn.setClickable(true);
                  stylePillButton(settingsBtn, false);
                  settingsBtn.setOnFocusChangeListener(new View.OnFocusChangeListener() {
                      @Override
                      public void onFocusChange(View v, boolean hasFocus) {
                          stylePillButton(settingsBtn, hasFocus);
                          v.animate().scaleX(hasFocus ? 1.08f : 1.0f).scaleY(hasFocus ? 1.08f : 1.0f).setDuration(150).start();
                      }
                  });
                  settingsBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          openSystemSettings();
                      }
                  });
                  LinearLayout.LayoutParams setBtnLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  setBtnLp.rightMargin = dp(18);
                  rightBar.addView(settingsBtn, setBtnLp);

                  LinearLayout clockCol = new LinearLayout(this);
                  clockCol.setOrientation(LinearLayout.VERTICAL);
                  clockCol.setGravity(Gravity.END);
                  rightBar.addView(clockCol, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  ));

                  clockTimeView = new TextView(this);
                  clockTimeView.setTextColor(Color.WHITE);
                  clockTimeView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 22);
                  clockTimeView.setTypeface(Typeface.DEFAULT_BOLD);
                  clockCol.addView(clockTimeView);

                  clockDateView = new TextView(this);
                  clockDateView.setTextColor(0xAAFFFFFF);
                  clockDateView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                  clockCol.addView(clockDateView);

                  mainColumn.addView(topBar, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  ));

                  // 2. Floating Apple TV Glassmorphic Top Dock
                  HorizontalScrollView dockScroll = new HorizontalScrollView(this);
                  dockScroll.setHorizontalScrollBarEnabled(false);
                  dockScroll.setClipToPadding(false);
                  dockScroll.setPadding(dp(20), dp(14), dp(20), dp(14));
                  GradientDrawable dockBg = new GradientDrawable();
                  dockBg.setColor(0x18FFFFFF);
                  dockBg.setCornerRadius(dp(26));
                  dockBg.setStroke(dp(1), 0x30FFFFFF);
                  dockScroll.setBackground(dockBg);

                  dockRowLayout = new LinearLayout(this);
                  dockRowLayout.setOrientation(LinearLayout.HORIZONTAL);
                  dockRowLayout.setGravity(Gravity.CENTER_VERTICAL);
                  dockScroll.addView(dockRowLayout, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  ));

                  LinearLayout.LayoutParams dockLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  dockLp.topMargin = dp(16);
                  mainColumn.addView(dockScroll, dockLp);

                  // 3. Section Header Row
                  LinearLayout headerRow = new LinearLayout(this);
                  headerRow.setOrientation(LinearLayout.HORIZONTAL);
                  headerRow.setGravity(Gravity.CENTER_VERTICAL);
                  LinearLayout.LayoutParams headerLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  headerLp.topMargin = dp(18);
                  headerLp.bottomMargin = dp(10);

                  TextView gridTitle = new TextView(this);
                  gridTitle.setText("All Apps & Sideloaded Channels  •  Hold OK on any app for options");
                  gridTitle.setTextColor(0xBBFFFFFF);
                  gridTitle.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                  gridTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  headerRow.addView(gridTitle, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.0f));

                  countLabelView = new TextView(this);
                  countLabelView.setTextColor(0x88FFFFFF);
                  countLabelView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  headerRow.addView(countLabelView, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  ));
                  mainColumn.addView(headerRow, headerLp);

                  // 4. Scrollable 6-Column App Grid
                  ScrollView gridScroll = new ScrollView(this);
                  gridScroll.setVerticalScrollBarEnabled(false);
                  gridScroll.setClipToPadding(false);

                  appsGridLayout = new GridLayout(this);
                  appsGridLayout.setColumnCount(6);
                  appsGridLayout.setUseDefaultMargins(false);
                  gridScroll.addView(appsGridLayout, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  ));

                  mainColumn.addView(gridScroll, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1.0f
                  ));

                  setContentView(rootContainer);
              }

              private void stylePillButton(TextView view, boolean focused) {
                  GradientDrawable gd = new GradientDrawable();
                  gd.setCornerRadius(dp(50));
                  gd.setColor(focused ? 0x44FFFFFF : 0x16FFFFFF);
                  gd.setStroke(dp(focused ? 2 : 1), focused ? Color.WHITE : 0x33FFFFFF);
                  view.setBackground(gd);
              }

              private void updateAmbientBackground(int accentColor) {
                  int darkTop = blendColor(accentColor, 0xFF090D16, 0.42f);
                  GradientDrawable bg = new GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          new int[]{darkTop, 0xFF0B0F19, 0xFF05070B}
                  );
                  rootContainer.setBackground(bg);
              }

              private int blendColor(int fg, int bg, float ratio) {
                  float inv = 1.0f - ratio;
                  int r = (int) ((Color.red(fg) * ratio) + (Color.red(bg) * inv));
                  int g = (int) ((Color.green(fg) * ratio) + (Color.green(bg) * inv));
                  int b = (int) ((Color.blue(fg) * ratio) + (Color.blue(bg) * inv));
                  return Color.rgb(r, g, b);
              }

              private void updateClock() {
                  Date now = new Date();
                  SimpleDateFormat timeFmt = new SimpleDateFormat("hh:mm a", Locale.getDefault());
                  SimpleDateFormat dateFmt = new SimpleDateFormat("EEE, d MMM", Locale.getDefault());
                  if (clockTimeView != null) clockTimeView.setText(timeFmt.format(now));
                  if (clockDateView != null) clockDateView.setText(dateFmt.format(now));
              }

              private void refreshAppCatalog() {
                  allApps = queryAllTvAndSideloadedApps();
                  if (countLabelView != null) {
                      countLabelView.setText(allApps.size() + " Installed");
                  }

                  // Populate Top Glassmorphic Dock (up to 6 pinned apps)
                  dockRowLayout.removeAllViews();
                  List<AppItem> dockItems = new ArrayList<AppItem>();
                  for (AppItem item : allApps) {
                      if (pinnedPackages.contains(item.packageName)) {
                          dockItems.add(item);
                      }
                  }
                  if (dockItems.isEmpty()) {
                      for (int i = 0; i < Math.min(6, allApps.size()); i++) {
                          dockItems.add(allApps.get(i));
                      }
                  } else if (dockItems.size() > 6) {
                      dockItems = dockItems.subList(0, 6);
                  }

                  for (int i = 0; i < dockItems.size(); i++) {
                      View tile = createAppCardView(dockItems.get(i), true);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(136), ViewGroup.LayoutParams.WRAP_CONTENT);
                      if (i < dockItems.size() - 1) {
                          lp.rightMargin = dp(18);
                      }
                      dockRowLayout.addView(tile, lp);
                  }

                  // Populate 6-Column All Apps Grid
                  appsGridLayout.removeAllViews();
                  int screenWidth = getResources().getDisplayMetrics().widthPixels;
                  int availableWidth = screenWidth - dp(88);
                  int margin = dp(14);
                  int tileWidth = (availableWidth - (margin * 5)) / 6;
                  if (tileWidth < dp(110)) tileWidth = dp(128);

                  for (int i = 0; i < allApps.size(); i++) {
                      AppItem item = allApps.get(i);
                      View tile = createAppCardView(item, false);
                      GridLayout.LayoutParams glp = new GridLayout.LayoutParams();
                      glp.width = tileWidth;
                      glp.height = ViewGroup.LayoutParams.WRAP_CONTENT;
                      glp.rightMargin = (i % 6 == 5) ? 0 : margin;
                      glp.bottomMargin = dp(16);
                      appsGridLayout.addView(tile, glp);
                  }
              }

              private View createAppCardView(final AppItem app, boolean isDock) {
                  LinearLayout wrapper = new LinearLayout(this);
                  wrapper.setOrientation(LinearLayout.VERTICAL);
                  wrapper.setGravity(Gravity.CENTER_HORIZONTAL);
                  wrapper.setFocusable(true);
                  wrapper.setClickable(true);
                  wrapper.setLongClickable(true);

                  final FrameLayout cardBox = new FrameLayout(this);
                  int cardHeight = isDock ? dp(74) : dp(80);
                  LinearLayout.LayoutParams boxLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          cardHeight
                  );
                  wrapper.addView(cardBox, boxLp);

                  styleAppCard(cardBox, app.accentColor, false);

                  ImageView img = new ImageView(this);
                  if (app.banner != null) {
                      img.setImageDrawable(app.banner);
                      img.setScaleType(ImageView.ScaleType.CENTER_CROP);
                      cardBox.addView(img, new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT
                      ));
                  } else if (app.icon != null) {
                      img.setImageDrawable(app.icon);
                      img.setScaleType(ImageView.ScaleType.FIT_CENTER);
                      FrameLayout.LayoutParams iconLp = new FrameLayout.LayoutParams(dp(46), dp(46));
                      iconLp.gravity = Gravity.CENTER;
                      cardBox.addView(img, iconLp);
                  }

                  final TextView labelView = new TextView(this);
                  labelView.setText(app.label);
                  labelView.setTextColor(0xBBFFFFFF);
                  labelView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                  labelView.setSingleLine(true);
                  labelView.setEllipsize(TextUtils.TruncateAt.END);
                  labelView.setGravity(Gravity.CENTER_HORIZONTAL);
                  LinearLayout.LayoutParams labelLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  labelLp.topMargin = dp(6);
                  wrapper.addView(labelView, labelLp);

                  wrapper.setOnFocusChangeListener(new View.OnFocusChangeListener() {
                      @Override
                      public void onFocusChange(View v, boolean hasFocus) {
                          styleAppCard(cardBox, app.accentColor, hasFocus);
                          labelView.setTextColor(hasFocus ? Color.WHITE : 0xBBFFFFFF);
                          labelView.setTypeface(hasFocus ? Typeface.DEFAULT_BOLD : Typeface.DEFAULT);
                          float scale = hasFocus ? 1.10f : 1.0f;
                          v.animate().scaleX(scale).scaleY(scale).setDuration(140).start();

                          if (hasFocus) {
                              heroBadgeView.setText(app.isLeanback ? "VIBEOS TV  •  AD-FREE" : "SIDELOADED APP");
                              heroTitleView.setText(app.label);
                              heroSubtitleView.setText(app.packageName + "  •  Press OK to open, Hold OK for options");
                              updateAmbientBackground(app.accentColor);
                          }
                      }
                  });

                  wrapper.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          launchPackage(app.packageName);
                      }
                  });

                  wrapper.setOnLongClickListener(new View.OnLongClickListener() {
                      @Override
                      public boolean onLongClick(View v) {
                          showAppOptionsDialog(app);
                          return true;
                      }
                  });

                  return wrapper;
              }

              private void styleAppCard(FrameLayout card, int accentColor, boolean focused) {
                  GradientDrawable gd = new GradientDrawable();
                  gd.setCornerRadius(dp(18));
                  int fill = focused ? blendColor(accentColor, 0xFF1E293B, 0.78f) : 0x1AFFFFFF;
                  gd.setColor(fill);
                  gd.setStroke(dp(focused ? 3 : 1), focused ? Color.WHITE : 0x26FFFFFF);
                  card.setBackground(gd);
              }

              private void showAppOptionsDialog(final AppItem app) {
                  final boolean isPinned = pinnedPackages.contains(app.packageName);
                  String[] options = new String[]{
                          isPinned ? "Remove from Top Dock" : "Pin to Top Dock",
                          "Open App Info / Force Stop",
                          "Uninstall App",
                          "Cancel"
                  };

                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(app.label)
                          .setItems(options, new DialogInterface.OnClickListener() {
                              @Override
                              public void onClick(DialogInterface dialog, int which) {
                                  if (which == 0) {
                                      if (isPinned) {
                                          pinnedPackages.remove(app.packageName);
                                      } else {
                                          pinnedPackages.add(app.packageName);
                                      }
                                      prefs.edit().putStringSet("pinned_dock", new HashSet<String>(pinnedPackages)).apply();
                                      refreshAppCatalog();
                                  } else if (which == 1) {
                                      openAppDetails(app.packageName);
                                  } else if (which == 2) {
                                      uninstallPackage(app.packageName);
                                  } else {
                                      dialog.dismiss();
                                  }
                              }
                          })
                          .show();
              }

              private List<AppItem> queryAllTvAndSideloadedApps() {
                  PackageManager pm = getPackageManager();
                  String selfPkg = getPackageName();
                  Map<String, Boolean> discovered = new LinkedHashMap<String, Boolean>();

                  Intent leanbackIntent = new Intent(Intent.ACTION_MAIN, null);
                  leanbackIntent.addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER);
                  List<ResolveInfo> tvList = pm.queryIntentActivities(leanbackIntent, 0);
                  if (tvList != null) {
                      for (ResolveInfo ri : tvList) {
                          if (ri.activityInfo != null) {
                              String pkg = ri.activityInfo.packageName;
                              if (!selfPkg.equals(pkg)) {
                                  discovered.put(pkg, Boolean.TRUE);
                              }
                          }
                      }
                  }

                  Intent stdIntent = new Intent(Intent.ACTION_MAIN, null);
                  stdIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> stdList = pm.queryIntentActivities(stdIntent, 0);
                  if (stdList != null) {
                      for (ResolveInfo ri : stdList) {
                          if (ri.activityInfo != null) {
                              String pkg = ri.activityInfo.packageName;
                              if (!selfPkg.equals(pkg) && !discovered.containsKey(pkg)) {
                                  discovered.put(pkg, Boolean.FALSE);
                              }
                          }
                      }
                  }

                  List<AppItem> result = new ArrayList<AppItem>();
                  int idx = 0;
                  for (Map.Entry<String, Boolean> entry : discovered.entrySet()) {
                      String pkg = entry.getKey();
                      boolean isLeanback = entry.getValue().booleanValue();
                      try {
                          ApplicationInfo ai = pm.getApplicationInfo(pkg, 0);
                          CharSequence labelCs = pm.getApplicationLabel(ai);
                          String label = (labelCs != null) ? labelCs.toString() : pkg;
                          Drawable icon = pm.getApplicationIcon(ai);
                          Drawable banner = pm.getApplicationBanner(ai);
                          int accent = PALETTE[idx % PALETTE.length];
                          idx++;
                          result.add(new AppItem(label, pkg, icon, banner, isLeanback, accent));
                      } catch (Exception ignored) {
                      }
                  }

                  Collections.sort(result, new Comparator<AppItem>() {
                      @Override
                      public int compare(AppItem a, AppItem b) {
                          if (a.isLeanback != b.isLeanback) {
                              return a.isLeanback ? -1 : 1;
                          }
                          return a.label.compareToIgnoreCase(b.label);
                      }
                  });
                  return result;
              }

              private void launchPackage(String packageName) {
                  try {
                      PackageManager pm = getPackageManager();
                      Intent intent = pm.getLeanbackLaunchIntentForPackage(packageName);
                      if (intent == null) {
                          intent = pm.getLaunchIntentForPackage(packageName);
                      }
                      if (intent != null) {
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                      }
                  } catch (Exception ignored) {
                  }
              }

              private void openSystemSettings() {
                  try {
                      Intent intent = new Intent(Settings.ACTION_SETTINGS);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                  } catch (Exception ignored) {
                  }
              }

              private void openAppDetails(String packageName) {
                  try {
                      Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                      intent.setData(Uri.fromParts("package", packageName, null));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                  } catch (Exception ignored) {
                  }
              }

              private void uninstallPackage(String packageName) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_DELETE);
                      intent.setData(Uri.fromParts("package", packageName, null));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                  } catch (Exception ignored) {
                  }
              }
          }
          EOF

          echo "[1/5] Linking AndroidManifest.xml with aapt2..."
          "$BUILD_TOOLS/aapt2" link \
            -o unsigned.apk \
            -I "$ANDROID_JAR" \
            --manifest AndroidManifest.xml \
            --java gen

          echo "[2/5] Compiling Java sources with javac..."
          javac --release 11 \
            -classpath "$ANDROID_JAR" \
            -d obj \
            $(find src gen -name "*.java")

          echo "[3/5] Converting bytecode to DEX with d8..."
          jar cf classes.jar -C obj .
          "$BUILD_TOOLS/d8" \
            --min-api 26 \
            --lib "$ANDROID_JAR" \
            --output . \
            classes.jar

          echo "[4/5] Packaging and aligning APK..."
          zip -uj unsigned.apk classes.dex
          "$BUILD_TOOLS/zipalign" -f -p 4 unsigned.apk aligned.apk

          echo "[5/5] Signing APK with debug key..."
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app-debug.apk \
            aligned.apk

          ls -lh app-debug.apk

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeOS-TV-Launcher-APK
          path: vibeos_apk/app-debug.apk
