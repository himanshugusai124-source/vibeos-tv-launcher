name: Build VibeOS TV Launcher APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Clean Android TV Project Structure
        run: |
          mkdir -p vibeos_build/app/src/main/java/com/vibeos/tvlauncher

          cat << 'EOF' > vibeos_build/settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VibeOSTVLauncher"
          include(":app")
          EOF

          cat << 'EOF' > vibeos_build/build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > vibeos_build/gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > vibeos_build/app/proguard-rules.pro
          # Keep Compose & TV classes
          EOF

          cat << 'EOF' > vibeos_build/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.vibeos.tvlauncher"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.vibeos.tvlauncher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf("-opt-in=androidx.compose.foundation.ExperimentalFoundationApi")
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.2")
          }
          EOF

          cat << 'EOF' > vibeos_build/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />

              <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />
              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:banner="@android:drawable/sym_def_app_icon"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="VibeOS TV"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > vibeos_build/app/src/main/java/com/vibeos/tvlauncher/MainActivity.kt
          @file:OptIn(ExperimentalFoundationApi::class)
          package com.vibeos.tvlauncher

          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.drawable.Drawable
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.compose.animation.animateColorAsState
          import androidx.compose.animation.core.Spring
          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.animation.core.spring
          import androidx.compose.animation.core.tween
          import androidx.compose.foundation.ExperimentalFoundationApi
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.combinedClickable
          import androidx.compose.foundation.focusable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Surface
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.focus.onFocusChanged
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.delay
          import java.text.SimpleDateFormat
          import java.util.*

          data class TvAppInfo(
              val label: String,
              val packageName: String,
              val icon: ImageBitmap?,
              val banner: ImageBitmap?,
              val isLeanback: Boolean,
              val accentColor: Color
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      VibeOsAppleTvLauncher()
                  }
              }
          }

          @Composable
          fun VibeOsAppleTvLauncher() {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("vibeos_prefs", Context.MODE_PRIVATE) }

              var allApps by remember { mutableStateOf<List<TvAppInfo>>(emptyList()) }
              var pinnedPackages by remember {
                  mutableStateOf(
                      prefs.getStringSet(
                          "pinned_dock",
                          setOf(
                              "com.google.android.youtube.tv",
                              "com.netflix.ninja",
                              "com.amazon.avod.thirdpartyclient",
                              "in.startv.hotstar",
                              "com.plexapp.android",
                              "com.android.tv.settings"
                          )
                      ) ?: emptySet()
                  )
              }
              var focusedApp by remember { mutableStateOf<TvAppInfo?>(null) }
              var selectedMenuApp by remember { mutableStateOf<TvAppInfo?>(null) }
              var currentTime by remember { mutableStateOf("") }
              var currentDate by remember { mutableStateOf("") }

              BackHandler(enabled = true) {
                  if (selectedMenuApp != null) {
                      selectedMenuApp = null
                  }
              }

              LaunchedEffect(Unit) {
                  val timeFmt = SimpleDateFormat("hh:mm a", Locale.getDefault())
                  val dateFmt = SimpleDateFormat("EEE, d MMM", Locale.getDefault())
                  while (true) {
                      val now = Date()
                      currentTime = timeFmt.format(now)
                      currentDate = dateFmt.format(now)
                      delay(10_000L)
                  }
              }

              LaunchedEffect(Unit) {
                  allApps = loadInstalledTvApps(context)
                  if (allApps.isNotEmpty() && focusedApp == null) {
                      focusedApp = allApps.first()
                  }
              }

              val targetAccent = focusedApp?.accentColor ?: Color(0xFF2563EB)
              val animatedAccent by animateColorAsState(
                  targetValue = targetAccent,
                  animationSpec = tween(durationMillis = 650),
                  label = "ambientAccent"
              )

              val dockApps = remember(allApps, pinnedPackages) {
                  val matched = allApps.filter { it.packageName in pinnedPackages }
                  if (matched.isNotEmpty()) matched.take(6) else allApps.take(6)
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(
                          Brush.radialGradient(
                              colors = listOf(
                                  animatedAccent.copy(alpha = 0.42f),
                                  Color(0xFF0B0F19),
                                  Color(0xFF05070B)
                              ),
                              radius = 1350f
                          )
                      )
                      .padding(horizontal = 48.dp, vertical = 28.dp)
              ) {
                  Column(modifier = Modifier.fillMaxSize()) {
                      TopHeroShelf(
                          focusedApp = focusedApp,
                          currentTime = currentTime,
                          currentDate = currentDate,
                          onOpenSettings = { openSystemSettings(context) }
                      )

                      Spacer(modifier = Modifier.height(18.dp))

                      GlassmorphicDock(
                          dockApps = dockApps,
                          onFocusApp = { focusedApp = it },
                          onClickApp = { launchApp(context, it.packageName) },
                          onLongClickApp = { selectedMenuApp = it }
                      )

                      Spacer(modifier = Modifier.height(22.dp))

                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text(
                              text = "Apps & Channels  •  Hold OK on any app to Pin/Manage",
                              color = Color.White.copy(alpha = 0.72f),
                              fontSize = 14.sp,
                              fontWeight = FontWeight.Medium
                          )
                          Text(
                              text = "${allApps.size} Installed",
                              color = Color.White.copy(alpha = 0.45f),
                              fontSize = 13.sp
                          )
                      }

                      Spacer(modifier = Modifier.height(12.dp))

                      LazyVerticalGrid(
                          columns = GridCells.Fixed(6),
                          verticalArrangement = Arrangement.spacedBy(18.dp),
                          horizontalArrangement = Arrangement.spacedBy(18.dp),
                          modifier = Modifier.fillMaxSize()
                      ) {
                          items(allApps, key = { it.packageName }) { app ->
                              AppGridTile(
                                  app = app,
                                  isPinned = app.packageName in pinnedPackages,
                                  onFocus = { focusedApp = app },
                                  onClick = { launchApp(context, it.packageName) },
                                  onLongClick = { selectedMenuApp = app }
                              )
                          }
                      }
                  }

                  selectedMenuApp?.let { menuApp ->
                      AppActionOverlay(
                          app = menuApp,
                          isPinned = menuApp.packageName in pinnedPackages,
                          onTogglePin = {
                              val updated = pinnedPackages.toMutableSet()
                              if (menuApp.packageName in updated) {
                                  updated.remove(menuApp.packageName)
                              } else {
                                  updated.add(menuApp.packageName)
                              }
                              pinnedPackages = updated
                              prefs.edit().putStringSet("pinned_dock", updated).apply()
                              selectedMenuApp = null
                          },
                          onOpenAppInfo = {
                              openAppDetails(context, menuApp.packageName)
                              selectedMenuApp = null
                          },
                          onUninstall = {
                              uninstallPackage(context, menuApp.packageName)
                              selectedMenuApp = null
                          },
                          onDismiss = { selectedMenuApp = null }
                      )
                  }
              }
          }

          @Composable
          fun TopHeroShelf(
              focusedApp: TvAppInfo?,
              currentTime: String,
              currentDate: String,
              onOpenSettings: () -> Unit
          ) {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(118.dp),
                  horizontalArrangement = Arrangement.SpaceBetween,
                  verticalAlignment = Alignment.Top
              ) {
                  Column(modifier = Modifier.weight(1f)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Box(
                              modifier = Modifier
                                  .clip(RoundedCornerShape(50))
                                  .background(Color.White.copy(alpha = 0.12f))
                                  .padding(horizontal = 12.dp, vertical = 4.dp)
                          ) {
                              Text(
                                  text = if (focusedApp?.isLeanback == false) "SIDELOADED APP" else "VIBEOS TV  •  AD-FREE",
                                  color = Color.White.copy(alpha = 0.85f),
                                  fontSize = 11.sp,
                                  fontWeight = FontWeight.SemiBold
                              )
                          }
                      }
                      Spacer(modifier = Modifier.height(10.dp))
                      Text(
                          text = focusedApp?.label ?: "VibeOS Home",
                          color = Color.White,
                          fontSize = 34.sp,
                          fontWeight = FontWeight.Bold,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                      Spacer(modifier = Modifier.height(4.dp))
                      Text(
                          text = focusedApp?.packageName ?: "Press OK to launch • Hold OK for options",
                          color = Color.White.copy(alpha = 0.55f),
                          fontSize = 13.sp,
                          maxLines = 1
                      )
                  }

                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(14.dp)
                  ) {
                      var settingsFocused by remember { mutableStateOf(false) }
                      Box(
                          modifier = Modifier
                              .onFocusChanged { settingsFocused = it.isFocused }
                              .clip(RoundedCornerShape(50))
                              .background(
                                  if (settingsFocused) Color.White.copy(alpha = 0.25f)
                                  else Color.White.copy(alpha = 0.08f)
                              )
                              .border(
                                  width = if (settingsFocused) 2.dp else 1.dp,
                                  color = if (settingsFocused) Color.White else Color.White.copy(alpha = 0.15f),
                                  shape = RoundedCornerShape(50)
                              )
                              .clickable { onOpenSettings() }
                              .focusable()
                              .padding(horizontal = 16.dp, vertical = 8.dp)
                      ) {
                          Text(
                              text = "⚙ TV Settings",
                              color = Color.White,
                              fontSize = 13.sp,
                              fontWeight = FontWeight.Medium
                          )
                      }

                      Column(horizontalAlignment = Alignment.End) {
                          Text(
                              text = currentTime,
                              color = Color.White,
                              fontSize = 24.sp,
                              fontWeight = FontWeight.SemiBold
                          )
                          Text(
                              text = currentDate,
                              color = Color.White.copy(alpha = 0.65f),
                              fontSize = 13.sp
                          )
                      }
                  }
              }
          }

          @Composable
          fun GlassmorphicDock(
              dockApps: List<TvAppInfo>,
              onFocusApp: (TvAppInfo) -> Unit,
              onClickApp: (TvAppInfo) -> Unit,
              onLongClickApp: (TvAppInfo) -> Unit
          ) {
              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(28.dp))
                      .background(Color.White.copy(alpha = 0.09f))
                      .border(1.dp, Color.White.copy(alpha = 0.18f), RoundedCornerShape(28.dp))
                      .padding(horizontal = 24.dp, vertical = 16.dp)
              ) {
                  LazyRow(
                      horizontalArrangement = Arrangement.spacedBy(20.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      items(dockApps, key = { "dock_${it.packageName}" }) { app ->
                          DockAppTile(
                              app = app,
                              onFocus = { onFocusApp(app) },
                              onClick = { onClickApp(app) },
                              onLongClick = { onLongClickApp(app) }
                          )
                      }
                  }
              }
          }

          @Composable
          fun DockAppTile(
              app: TvAppInfo,
              onFocus: () -> Unit,
              onClick: () -> Unit,
              onLongClick: () -> Unit
          ) {
              var isFocused by remember { mutableStateOf(false) }
              val scale by animateFloatAsState(
                  targetValue = if (isFocused) 1.12f else 1.0f,
                  animationSpec = spring(stiffness = Spring.StiffnessMediumLow),
                  label = "dockScale"
              )

              Column(
                  horizontalAlignment = Alignment.CenterHorizontally,
                  modifier = Modifier
                      .width(128.dp)
                      .scale(scale)
                      .onFocusChanged {
                          isFocused = it.isFocused
                          if (it.isFocused) onFocus()
                      }
                      .combinedClickable(
                          onClick = onClick,
                          onLongClick = onLongClick
                      )
                      .focusable()
              ) {
                  Box(
                      contentAlignment = Alignment.Center,
                      modifier = Modifier
                          .size(width = 124.dp, height = 72.dp)
                          .clip(RoundedCornerShape(18.dp))
                          .background(app.accentColor.copy(alpha = if (isFocused) 0.85f else 0.45f))
                          .border(
                              width = if (isFocused) 2.5.dp else 1.dp,
                              color = if (isFocused) Color.White else Color.White.copy(alpha = 0.2f),
                              shape = RoundedCornerShape(18.dp)
                          )
                  ) {
                      if (app.banner != null) {
                          Image(
                              bitmap = app.banner,
                              contentDescription = app.label,
                              contentScale = ContentScale.Crop,
                              modifier = Modifier.fillMaxSize()
                          )
                      } else if (app.icon != null) {
                          Image(
                              bitmap = app.icon,
                              contentDescription = app.label,
                              modifier = Modifier.size(44.dp)
                          )
                      }
                  }
                  Spacer(modifier = Modifier.height(6.dp))
                  Text(
                      text = app.label,
                      color = if (isFocused) Color.White else Color.White.copy(alpha = 0.75f),
                      fontSize = 12.sp,
                      fontWeight = if (isFocused) FontWeight.Bold else FontWeight.Medium,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis
                  )
              }
          }

          @Composable
          fun AppGridTile(
              app: TvAppInfo,
              isPinned: Boolean,
              onFocus: () -> Unit,
              onClick: () -> Unit,
              onLongClick: () -> Unit
          ) {
              var isFocused by remember { mutableStateOf(false) }
              val scale by animateFloatAsState(
                  targetValue = if (isFocused) 1.09f else 1.0f,
                  animationSpec = spring(stiffness = Spring.StiffnessMediumLow),
                  label = "gridScale"
              )

              Column(
                  horizontalAlignment = Alignment.CenterHorizontally,
                  modifier = Modifier
                      .scale(scale)
                      .onFocusChanged {
                          isFocused = it.isFocused
                          if (it.isFocused) onFocus()
                      }
                      .combinedClickable(
                          onClick = onClick,
                          onLongClick = onLongClick
                      )
                      .focusable()
              ) {
                  Box(
                      contentAlignment = Alignment.Center,
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(82.dp)
                          .clip(RoundedCornerShape(18.dp))
                          .background(
                              if (isFocused) app.accentColor.copy(alpha = 0.72f)
                              else Color.White.copy(alpha = 0.08f)
                          )
                          .border(
                              width = if (isFocused) 2.5.dp else 1.dp,
                              color = if (isFocused) Color.White else Color.White.copy(alpha = 0.14f),
                              shape = RoundedCornerShape(18.dp)
                          )
                  ) {
                      if (app.banner != null) {
                          Image(
                              bitmap = app.banner,
                              contentDescription = app.label,
                              contentScale = ContentScale.Crop,
                              modifier = Modifier.fillMaxSize()
                          )
                      } else if (app.icon != null) {
                          Image(
                              bitmap = app.icon,
                              contentDescription = app.label,
                              modifier = Modifier.size(46.dp)
                          )
                      }

                      if (isPinned) {
                          Box(
                              modifier = Modifier
                                  .align(Alignment.TopEnd)
                                  .padding(6.dp)
                                  .size(8.dp)
                                  .clip(CircleShape)
                                  .background(Color(0xFF38BDF8))
                          )
                      }
                  }
                  Spacer(modifier = Modifier.height(6.dp))
                  Text(
                      text = app.label,
                      color = if (isFocused) Color.White else Color.White.copy(alpha = 0.72f),
                      fontSize = 12.sp,
                      fontWeight = if (isFocused) FontWeight.SemiBold else FontWeight.Normal,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis
                  )
              }
          }

          @Composable
          fun AppActionOverlay(
              app: TvAppInfo,
              isPinned: Boolean,
              onTogglePin: () -> Unit,
              onOpenAppInfo: () -> Unit,
              onUninstall: () -> Unit,
              onDismiss: () -> Unit
          ) {
              Box(
                  contentAlignment = Alignment.Center,
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.Black.copy(alpha = 0.72f))
              ) {
                  Surface(
                      color = Color(0xFF141B2D),
                      shape = RoundedCornerShape(24.dp),
                      modifier = Modifier
                          .width(380.dp)
                          .border(1.dp, Color.White.copy(alpha = 0.2f), RoundedCornerShape(24.dp))
                  ) {
                      Column(
                          modifier = Modifier.padding(24.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp)
                      ) {
                          Text(
                              text = app.label,
                              color = Color.White,
                              fontSize = 20.sp,
                              fontWeight = FontWeight.Bold
                          )
                          Text(
                              text = app.packageName,
                              color = Color.White.copy(alpha = 0.55f),
                              fontSize = 12.sp
                          )
                          Spacer(modifier = Modifier.height(6.dp))
                          DialogActionButton(
                              label = if (isPinned) "Remove from Top Dock" else "Pin to Top Dock",
                              onClick = onTogglePin
                          )
                          DialogActionButton(
                              label = "App Info & Force Stop (Android Settings)",
                              onClick = onOpenAppInfo
                          )
                          DialogActionButton(
                              label = "Uninstall App",
                              onClick = onUninstall
                          )
                          DialogActionButton(
                              label = "Cancel",
                              onClick = onDismiss
                          )
                      }
                  }
              }
          }

          @Composable
          fun DialogActionButton(label: String, onClick: () -> Unit) {
              var focused by remember { mutableStateOf(false) }
              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .onFocusChanged { focused = it.isFocused }
                      .clip(RoundedCornerShape(12.dp))
                      .background(if (focused) Color.White else Color.White.copy(alpha = 0.1f))
                      .clickable { onClick() }
                      .focusable()
                      .padding(horizontal = 16.dp, vertical = 12.dp)
              ) {
                  Text(
                      text = label,
                      color = if (focused) Color.Black else Color.White,
                      fontSize = 14.sp,
                      fontWeight = FontWeight.SemiBold
                  )
              }
          }

          fun loadInstalledTvApps(context: Context): List<TvAppInfo> {
              val pm = context.packageManager
              val selfPkg = context.packageName
              val discovered = linkedMapOf<String, Boolean>()

              val leanbackIntent = Intent(Intent.ACTION_MAIN, null).apply {
                  addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER)
              }
              pm.queryIntentActivities(leanbackIntent, 0).forEach { ri ->
                  val pkg = ri.activityInfo.packageName
                  if (pkg != selfPkg) discovered[pkg] = true
              }

              val standardIntent = Intent(Intent.ACTION_MAIN, null).apply {
                  addCategory(Intent.CATEGORY_LAUNCHER)
              }
              pm.queryIntentActivities(standardIntent, 0).forEach { ri ->
                  val pkg = ri.activityInfo.packageName
                  if (pkg != selfPkg && pkg !in discovered) {
                      discovered[pkg] = false
                  }
              }

              val palette = listOf(
                  Color(0xFF2563EB),
                  Color(0xFF7C3AED),
                  Color(0xFFDB2777),
                  Color(0xFF059669),
                  Color(0xFFD97706),
                  Color(0xFF0891B2),
                  Color(0xFF4F46E5),
                  Color(0xFFE11D48)
              )

              return discovered.entries.mapIndexedNotNull { idx, (pkg, isLeanback) ->
                  try {
                      val appInfo = pm.getApplicationInfo(pkg, 0)
                      val label = pm.getApplicationLabel(appInfo).toString()
                      val iconDrawable = pm.getApplicationIcon(appInfo)
                      val bannerDrawable = pm.getApplicationBanner(appInfo)
                      TvAppInfo(
                          label = label,
                          packageName = pkg,
                          icon = drawableToImageBitmap(iconDrawable, 128, 128),
                          banner = bannerDrawable?.let { drawableToImageBitmap(it, 320, 180) },
                          isLeanback = isLeanback,
                          accentColor = palette[idx % palette.size]
                      )
                  } catch (_: Exception) {
                      null
                  }
              }.sortedWith(compareByDescending<TvAppInfo> { it.isLeanback }.thenBy { it.label.lowercase(Locale.ROOT) })
          }

          fun drawableToImageBitmap(drawable: Drawable, width: Int, height: Int): ImageBitmap {
              val w = if (drawable.intrinsicWidth > 0) drawable.intrinsicWidth else width
              val h = if (drawable.intrinsicHeight > 0) drawable.intrinsicHeight else height
              val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
              val canvas = Canvas(bmp)
              drawable.setBounds(0, 0, canvas.width, canvas.height)
              drawable.draw(canvas)
              return bmp.asImageBitmap()
          }

          fun launchApp(context: Context, packageName: String) {
              val pm = context.packageManager
              val intent = pm.getLeanbackLaunchIntentForPackage(packageName)
                  ?: pm.getLaunchIntentForPackage(packageName)
              intent?.let {
                  it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  context.startActivity(it)
              }
          }

          fun openSystemSettings(context: Context) {
              context.startActivity(Intent(Settings.ACTION_SETTINGS).apply {
                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              })
          }

          fun openAppDetails(context: Context, packageName: String) {
              context.startActivity(
                  Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                      data = Uri.fromParts("package", packageName, null)
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
              )
          }

          fun uninstallPackage(context: Context, packageName: String) {
              context.startActivity(
                  Intent(Intent.ACTION_DELETE).apply {
                      data = Uri.fromParts("package", packageName, null)
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
              )
          }
          EOF

      - name: Build Debug APK
        working-directory: vibeos_build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeOS-TV-Launcher-APK
          path: vibeos_build/app/build/outputs/apk/debug/app-debug.apk
